[package]
name = "vcf_uniprot_merger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
flate2 = "1.1.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
